<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body { font-family: Arial; background: linear-gradient(135deg, #667eea, #764ba2); padding: 20px; }
        .dashboard { max-width: 1400px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; }
        h1 { color: #667eea; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th { background: #667eea; color: white; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
        input, select { width: 100%; padding: 5px; border: 1px solid #ddd; }
        button { background: #667eea; color: white; border: none; padding: 10px 20px; cursor: pointer; margin: 5px; border-radius: 5px; }
        .danger { background: #ff4444; }
        .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 20px 0; }
        .totals div { background: #f5f5f5; padding: 20px; text-align: center; border-radius: 10px; }
        .totals .big { background: #667eea; color: white; }
        .big-text { font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>🚢 Dashboard de Contenedores</h1>
        <p style="text-align:center;">Datos guardados en tu navegador</p>
        
        <table>
            <thead>
                <tr>
                    <th>N°</th><th>Contenedor</th><th>Fecha</th><th>Estado</th>
                    <th>FOB</th><th>Aduana</th><th>Naviera</th><th>Almacén</th><th>Poggi</th>
                    <th>Total</th><th>Acción</th>
                </tr>
            </thead>
            <tbody id="bodyTable"></tbody>
        </table>
        
        <button onclick="addRow()">➕ Agregar</button>
        
        <div class="totals">
            <div><p>FOB</p><p class="big-text" id="tFOB">$0</p></div>
            <div><p>Aduana</p><p class="big-text" id="tAduana">$0</p></div>
            <div><p>Gastos</p><p class="big-text" id="tGastos">$0</p></div>
            <div class="big"><p>TOTAL</p><p class="big-text" id="tTotal">$0</p></div>
        </div>
        
        <button onclick="exportar()">📊 Exportar Excel</button>
    </div>

    <script>
        // Cargar datos guardados
        let items = JSON.parse(localStorage.getItem('misdatos')) || [];
        
        // Si no hay datos, crear 3 de ejemplo
        if (items.length === 0) {
            items = [
                {id:1, cont:'MSCU1234567', fecha:'2024-01-15', estado:'En tránsito', fob:15000, aduana:2500, naviera:1200, almacen:800, poggi:500},
                {id:2, cont:'MAEU9876543', fecha:'2024-01-20', estado:'En aduana', fob:22000, aduana:3800, naviera:1500, almacen:950, poggi:600},
                {id:3, cont:'CMAU4567890', fecha:'2024-02-01', estado:'Liberado', fob:18000, aduana:3000, naviera:1300, almacen:850, poggi:550}
            ];
            guardar();
        }
        
        function guardar() {
            localStorage.setItem('misdatos', JSON.stringify(items));
        }
        
        function mostrar() {
            let html = '';
            items.forEach((item, i) => {
                let total = item.fob + item.aduana + item.naviera + item.almacen + item.poggi;
                html += `<tr>
                    <td>${i+1}</td>
                    <td><input value="${item.cont}" onchange="cambiar(${item.id}, 'cont', this.value)"></td>
                    <td><input type="date" value="${item.fecha}" onchange="cambiar(${item.id}, 'fecha', this.value)"></td>
                    <td><select onchange="cambiar(${item.id}, 'estado', this.value)">
                        <option ${item.estado=='En tránsito'?'selected':''}>En tránsito</option>
                        <option ${item.estado=='En aduana'?'selected':''}>En aduana</option>
                        <option ${item.estado=='Liberado'?'selected':''}>Liberado</option>
                        <option ${item.estado=='Entregado'?'selected':''}>Entregado</option>
                    </select></td>
                    <td><input type="number" value="${item.fob}" onchange="cambiar(${item.id}, 'fob', Number(this.value))"></td>
                    <td><input type="number" value="${item.aduana}" onchange="cambiar(${item.id}, 'aduana', Number(this.value))"></td>
                    <td><input type="number" value="${item.naviera}" onchange="cambiar(${item.id}, 'naviera', Number(this.value))"></td>
                    <td><input type="number" value="${item.almacen}" onchange="cambiar(${item.id}, 'almacen', Number(this.value))"></td>
                    <td><input type="number" value="${item.poggi}" onchange="cambiar(${item.id}, 'poggi', Number(this.value))"></td>
                    <td><b>$${total.toFixed(2)}</b></td>
                    <td><button class="danger" onclick="borrar(${item.id})">X</button></td>
                </tr>`;
            });
            document.getElementById('bodyTable').innerHTML = html;
            calcularTotales();
        }
        
        function cambiar(id, campo, valor) {
            let item = items.find(i => i.id === id);
            item[campo] = valor;
            guardar();
            mostrar();
        }
        
        function addRow() {
            let maxId = items.length > 0 ? Math.max(...items.map(i => i.id)) : 0;
            items.push({
                id: maxId + 1,
                cont: '',
                fecha: '',
                estado: 'En tránsito',
                fob: 0,
                aduana: 0,
                naviera: 0,
                almacen: 0,
                poggi: 0
            });
            guardar();
            mostrar();
        }
        
        function borrar(id) {
            if (confirm('¿Eliminar?')) {
                items = items.filter(i => i.id !== id);
                guardar();
                mostrar();
            }
        }
        
        function calcularTotales() {
            let fob = 0, aduana = 0, naviera = 0, almacen = 0, poggi = 0;
            items.forEach(i => {
                fob += i.fob;
                aduana += i.aduana;
                naviera += i.naviera;
                almacen += i.almacen;
                poggi += i.poggi;
            });
            document.getElementById('tFOB').textContent = '$' + fob.toFixed(2);
            document.getElementById('tAduana').textContent = '$' + aduana.toFixed(2);
            document.getElementById('tGastos').textContent = '$' + (naviera + almacen + poggi).toFixed(2);
            document.getElementById('tTotal').textContent = '$' + (fob + aduana + naviera + almacen + poggi).toFixed(2);
        }
        
        function exportar() {
            let csv = "N°,Contenedor,Fecha,Estado,FOB,Aduana,Naviera,Almacén,Poggi,Total\n";
            items.forEach((i, idx) => {
                csv += `${idx+1},"${i.cont}","${i.fecha}","${i.estado}",${i.fob},${i.aduana},${i.naviera},${i.almacen},${i.poggi},${(i.fob+i.aduana+i.naviera+i.almacen+i.poggi).toFixed(2)}\n`;
            });
            let blob = new Blob([csv], {type: 'text/csv'});
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'contenedores.csv';
            a.click();
        }
        
        // Mostrar tabla al cargar
        mostrar();
    </script>
</body>
</html>
